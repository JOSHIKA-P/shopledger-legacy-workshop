<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">The frontend UI communicates with the Express server entry point. The server mounts four routers and serves the invoice route. All API endpoints and library modules are listed. Configuration is imported by the server and selected modules. The store library reads and writes the JSON data file. The lower panel shows order placement from request through persistence and the 201 response.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52657a"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:14px;fill:#52657a}
      .section{font-size:17px;font-weight:700;letter-spacing:.5px;fill:#344b64}
      .box{fill:#fff;stroke:#b8c7d8;stroke-width:1.5;rx:11}
      .ui{fill:#eef6ff;stroke:#78a9e8}.server{fill:#f3f7fb;stroke:#71869d;stroke-width:2}.route{fill:#f0fdf4;stroke:#75bd8b}.lib{fill:#fff7ed;stroke:#e4a46d}.data{fill:#f5f3ff;stroke:#a99be5}.cfg{fill:#fff1f2;stroke:#e59aa5}
      .name{font-size:15px;font-weight:700}.small{font-size:12.5px;fill:#52657a}.tiny{font-size:10.5px;fill:#52657a}.routeEndpoint{font-size:12px;fill:#52657a}
      .line{fill:none;stroke:#52657a;stroke-width:1.6;marker-end:url(#arrow)}.orderLine{fill:none;stroke:#2563eb;stroke-width:2.3;marker-end:url(#blueArrow)}
      .num{fill:#2563eb}.numText{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .flowbox{fill:#eff6ff;stroke:#8db5f0;stroke-width:1.4;rx:10}.flowtitle{font-size:13px;font-weight:700}.flowdetail{font-size:12px;fill:#52657a}
      .labelbg{fill:#f7f9fc;stroke:#d9e1ea;stroke-width:.8;rx:5}.connectorLabel{font-size:10px;font-weight:600;fill:#52657a;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="1320" fill="#f7f9fc"/>
  <text x="48" y="54" class="title">ShopLedger</text>
  <text x="48" y="79" class="subtitle">Application architecture · order placement flow</text>

  <!-- Frontend -->
  <rect x="48" y="142" width="290" height="260" class="box ui"/>
  <text x="68" y="172" class="section">FRONTEND UI</text>
  <rect x="68" y="190" width="250" height="54" class="box"/><text x="84" y="213" class="name">public/index.html</text><text x="84" y="231" class="small">Page structure</text>
  <rect x="68" y="256" width="250" height="54" class="box"/><text x="84" y="279" class="name">public/js/app.js</text><text x="84" y="297" class="small">POS · orders · Khata · audit UI</text>
  <rect x="68" y="322" width="250" height="54" class="box"/><text x="84" y="345" class="name">public/css/style.css</text><text x="84" y="363" class="small">Page styles</text>

  <!-- Express backend entry point -->
  <rect x="384" y="142" width="190" height="260" class="box server"/>
  <text x="404" y="172" class="section">EXPRESS BACKEND</text>
  <rect x="404" y="190" width="150" height="76" class="box"/><text x="420" y="216" class="name">server.js</text><text x="420" y="237" class="small">Express entry point</text><text x="420" y="253" class="tiny">static UI · routes · invoice</text>
  <text x="404" y="298" class="small">Serves public/</text>
  <text x="404" y="319" class="small">Mounts routers under /api</text>
  <text x="404" y="340" class="small">GET /orders/:id/invoice</text>

  <!-- Routers -->
  <rect x="620" y="142" width="330" height="500" class="box route"/>
  <text x="640" y="172" class="section">ROUTERS · routes/</text>
  <rect x="640" y="190" width="290" height="68" class="box"/><text x="656" y="212" class="name">products.js</text><text x="656" y="234" class="routeEndpoint">GET /api/products</text><text x="656" y="250" class="routeEndpoint">GET /api/coupons</text>
  <rect x="640" y="266" width="290" height="100" class="box"/><text x="656" y="288" class="name">orders.js</text><text x="656" y="311" class="routeEndpoint">GET /api/orders</text><text x="656" y="327" class="routeEndpoint">GET /api/orders/:id</text><text x="656" y="343" class="routeEndpoint">POST /api/orders</text><text x="656" y="359" class="routeEndpoint">POST /api/orders/:id/cancel</text>
  <rect x="640" y="374" width="290" height="84" class="box"/><text x="656" y="396" class="name">customers.js</text><text x="656" y="419" class="routeEndpoint">GET /api/customers</text><text x="656" y="435" class="routeEndpoint">POST /api/customers/:id/settle</text>
  <rect x="640" y="466" width="290" height="140" class="box"/><text x="656" y="488" class="name">reports.js</text><text x="656" y="511" class="routeEndpoint">GET /api/reports/dashboard</text><text x="656" y="527" class="routeEndpoint">GET /api/reports/gst-reconciliation</text><text x="656" y="543" class="routeEndpoint">POST /api/pricing/preview</text><text x="656" y="559" class="routeEndpoint">GET /api/admin/export</text>
  <text x="640" y="628" class="tiny">Mounted by server.js under /api</text>

  <!-- Library modules -->
  <rect x="994" y="142" width="340" height="566" class="box lib"/>
  <text x="1014" y="172" class="section">LIBRARY MODULES · lib/</text>
  <rect x="1014" y="190" width="300" height="42" class="box"/><text x="1030" y="216" class="name">orders.js</text>
  <rect x="1014" y="240" width="300" height="42" class="box"/><text x="1030" y="266" class="name">inventory.js</text>
  <rect x="1014" y="290" width="300" height="42" class="box"/><text x="1030" y="316" class="name">pricing.js</text>
  <rect x="1014" y="340" width="300" height="42" class="box"/><text x="1030" y="366" class="name">coupons.js</text>
  <rect x="1014" y="390" width="300" height="42" class="box"/><text x="1030" y="416" class="name">tax.js</text>
  <rect x="1014" y="440" width="300" height="42" class="box"/><text x="1030" y="466" class="name">ledger.js</text>
  <rect x="1014" y="490" width="300" height="42" class="box"/><text x="1030" y="516" class="name">reports.js</text>
  <rect x="1014" y="540" width="300" height="42" class="box"/><text x="1030" y="566" class="name">invoice.js</text>
  <rect x="1014" y="590" width="300" height="42" class="box"/><text x="1030" y="616" class="name">store.js</text>
  <rect x="1014" y="640" width="300" height="42" class="box"/><text x="1030" y="666" class="name">dates.js</text>

  <!-- Configuration and persisted data -->
  <rect x="1370" y="142" width="190" height="210" class="box cfg"/>
  <text x="1390" y="172" class="section">CONFIG</text>
  <text x="1390" y="204" class="name">config.js</text>
  <text x="1390" y="229" class="small">port · shop · tax</text>
  <text x="1390" y="249" class="small">coupons · inventory</text>
  <text x="1390" y="269" class="small">adminKey</text>
  <text x="1390" y="294" class="tiny">Imported by:</text>
  <text x="1390" y="309" class="tiny">server.js · routes/reports.js</text>
  <text x="1390" y="324" class="tiny">lib/inventory.js · lib/tax.js</text>
  <text x="1390" y="339" class="tiny">lib/coupons.js · lib/invoice.js</text>
  <rect x="1370" y="376" width="190" height="170" class="box data"/>
  <text x="1390" y="406" class="section">JSON DATA</text>
  <text x="1390" y="438" class="name">data/db.json</text>
  <text x="1390" y="463" class="small">products · orders</text>
  <text x="1390" y="483" class="small">customers · settlements</text>
  <text x="1390" y="503" class="small">auditLog</text>
  <text x="1390" y="529" class="tiny">Accessed by lib/store.js</text>

  <!-- Accurate, routed connectors with labels placed in clear gaps -->
  <path d="M338 270 H384" class="line"/>
  <rect x="337" y="238" width="49" height="20" class="labelbg"/><text x="361" y="252" class="connectorLabel">HTTP</text>
  <path d="M574 270 H620" class="line"/>
  <rect x="568" y="238" width="61" height="20" class="labelbg"/><text x="598" y="252" class="connectorLabel">mounts</text>
  <path d="M950 304 H994" class="line"/>
  <rect x="948" y="271" width="49" height="20" class="labelbg"/><text x="972" y="285" class="connectorLabel">uses</text>
  <path d="M1314 611 H1340 V461 H1370" class="line"/>
  <rect x="1315" y="567" width="60" height="20" class="labelbg"/><text x="1345" y="581" class="connectorLabel">read/write</text>

  <!-- Order placement flow -->
  <rect x="48" y="758" width="1512" height="520" fill="#fff" stroke="#b8c7d8" stroke-width="1.5" rx="14"/>
  <text x="72" y="795" class="section">ORDER PLACEMENT · POST /api/orders</text>
  <text x="72" y="819" class="subtitle">Request and processing sequence from the UI through persistence to data/db.json.</text>

  <g>
    <rect x="72" y="856" width="260" height="100" class="flowbox"/><circle cx="92" cy="876" r="13" class="num"/><text x="92" y="876" class="numText">1</text>
    <text x="114" y="881" class="flowtitle">public/js/app.js</text><text x="90" y="908" class="flowdetail">POST /api/orders</text><text x="90" y="928" class="flowdetail">items · customer · paymentMode · coupon</text>
    <rect x="382" y="856" width="260" height="100" class="flowbox"/><circle cx="402" cy="876" r="13" class="num"/><text x="402" y="876" class="numText">2</text>
    <text x="424" y="881" class="flowtitle">server.js → routes/orders.js</text><text x="400" y="908" class="flowdetail">store.read() · resolve product IDs</text><text x="400" y="928" class="flowdetail">build order line items</text>
    <rect x="692" y="856" width="260" height="100" class="flowbox"/><circle cx="712" cy="876" r="13" class="num"/><text x="712" y="876" class="numText">3</text>
    <text x="734" y="881" class="flowtitle">inventory.js</text><text x="710" y="908" class="flowdetail">inventory.check(products, items)</text><text x="710" y="928" class="flowdetail">reject if stock check fails</text>
    <rect x="1002" y="856" width="260" height="100" class="flowbox"/><circle cx="1022" cy="876" r="13" class="num"/><text x="1022" y="876" class="numText">4</text>
    <text x="1044" y="881" class="flowtitle">coupons.js · pricing.js · tax.js</text><text x="1020" y="908" class="flowdetail">validate coupon · compute totals</text><text x="1020" y="928" class="flowdetail">subtotal · discount · GST · total</text>
    <rect x="1312" y="856" width="220" height="100" class="flowbox"/><circle cx="1332" cy="876" r="13" class="num"/><text x="1332" y="876" class="numText">5</text>
    <text x="1354" y="881" class="flowtitle">ledger.js (if khata)</text><text x="1330" y="908" class="flowdetail">chargeOrderToKhata</text><text x="1330" y="928" class="flowdetail">account and credit check</text>
    <path d="M332 906 H382" class="orderLine"/><path d="M642 906 H692" class="orderLine"/><path d="M952 906 H1002" class="orderLine"/><path d="M1262 906 H1312" class="orderLine"/>

    <rect x="1312" y="1078" width="220" height="100" class="flowbox"/><circle cx="1332" cy="1098" r="13" class="num"/><text x="1332" y="1098" class="numText">6</text>
    <text x="1354" y="1103" class="flowtitle">inventory.js</text><text x="1330" y="1130" class="flowdetail">inventory.reserve</text><text x="1330" y="1150" class="flowdetail">deduct stock</text>
    <rect x="1002" y="1078" width="260" height="100" class="flowbox"/><circle cx="1022" cy="1098" r="13" class="num"/><text x="1022" y="1098" class="numText">7</text>
    <text x="1044" y="1103" class="flowtitle">orders.js</text><text x="1020" y="1130" class="flowdetail">orders.add(db, orderData)</text><text x="1020" y="1150" class="flowdetail">assign ID · add order to db</text>
    <rect x="692" y="1078" width="260" height="100" class="flowbox"/><circle cx="712" cy="1098" r="13" class="num"/><text x="712" y="1098" class="numText">8</text>
    <text x="734" y="1103" class="flowtitle">store.js</text><text x="710" y="1130" class="flowdetail">appendAudit(db, ...)</text><text x="710" y="1150" class="flowdetail">write(db)</text>
    <rect x="382" y="1078" width="260" height="100" class="flowbox"/><circle cx="402" cy="1098" r="13" class="num"/><text x="402" y="1098" class="numText">9</text>
    <text x="424" y="1103" class="flowtitle">data/db.json</text><text x="400" y="1130" class="flowdetail">persist updated products, order,</text><text x="400" y="1150" class="flowdetail">customer balances, and auditLog</text>
    <rect x="72" y="1078" width="260" height="100" class="flowbox"/><circle cx="92" cy="1098" r="13" class="num"/><text x="92" y="1098" class="numText">10</text>
    <text x="114" y="1103" class="flowtitle">201 response</text><text x="90" y="1130" class="flowdetail">server.js returns created order JSON</text><text x="90" y="1150" class="flowdetail">to the POS UI</text>
    <path d="M1422 956 V1018 H1422 V1078" class="orderLine"/>
    <path d="M1312 1128 H1262" class="orderLine"/><path d="M1002 1128 H952" class="orderLine"/><path d="M692 1128 H642" class="orderLine"/><path d="M382 1128 H332" class="orderLine"/>
    <rect x="1391" y="987" width="62" height="20" class="labelbg"/><text x="1422" y="1001" class="connectorLabel">then</text>
  </g>
</svg>
